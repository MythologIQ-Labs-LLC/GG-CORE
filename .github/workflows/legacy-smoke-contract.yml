name: Legacy smoke contract
on:
  pull_request:
    paths:
      - scripts/e2e-proof.sh
      - scripts/e2e-proof.ps1
      - scripts/qualification/daemon_json_contract.py
      - scripts/qualification/test_daemon_json_contract.py
      - scripts/qualification/test_e2e_smoke_contract.py
      - scripts/qualification/test_e2e_smoke_windows.ps1
      - scripts/rc-acceptance.sh
      - .github/workflows/legacy-smoke-contract.yml
  push:
    branches: [main]
    paths:
      - scripts/e2e-proof.sh
      - scripts/e2e-proof.ps1
      - scripts/qualification/daemon_json_contract.py
      - scripts/qualification/test_daemon_json_contract.py
      - scripts/qualification/test_e2e_smoke_contract.py
      - scripts/qualification/test_e2e_smoke_windows.ps1
      - scripts/rc-acceptance.sh
      - .github/workflows/legacy-smoke-contract.yml

permissions:
  contents: read

jobs:
  model-free-contract:
    name: Offline smoke truthfulness (model-free)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate Bash script syntax and offline JSON/smoke contracts
        run: |
          bash -n scripts/e2e-proof.sh
          bash -n scripts/rc-acceptance.sh
          python3 -m unittest discover -s scripts/qualification -p 'test_*_contract.py' -v

  windows-model-free-contract:
    name: Windows smoke truthfulness (model-free)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate native PowerShell diagnostic failure behavior
        shell: pwsh
        run: ./scripts/qualification/test_e2e_smoke_windows.ps1
