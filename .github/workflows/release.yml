name: Release

# Tag-triggered release pipeline (review M6 / Phase 1).
# Pushing a version tag verifies the tree at the tag, builds the consumable
# artifacts on all three platforms, and publishes a GitHub Release:
#   - gg-core-cli binary (standalone daemon + CLI)
#   - cdylib + generated include/gg_core.h (C FFI surface)
#   - per-file SHA-256 checksums
# Manual workflow_dispatch builds the same release packages without publishing.
# All packages must contain the real GGUF backend, or packaging fails.

on:
  workflow_dispatch:
    inputs:
      qualify:
        description: "Run real-model acceptance against each packaged archive"
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify source, GGUF tests and tag contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: core-runtime
    outputs:
      crate_version: ${{ steps.version.outputs.crate_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Formatting gate
        run: cargo fmt --check
      - name: Lint gate
        run: cargo clippy --all-targets -- -D warnings
      - name: Default test suite
        run: cargo test --locked --workspace
      - name: GGUF backend test suite
        run: cargo test --locked --features gguf
      - name: Supply-chain policy (exceptions are recorded in deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core-runtime/Cargo.toml
      - name: Tag must match the crate version
        id: version
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='gg-core'))")
          echo "crate_version=$CRATE_VERSION" >> "$GITHUB_OUTPUT"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE_VERSION"
              exit 1
            fi
            # Headings are "## [X.Y.Z] - YYYY-MM-DD": match the literal
            # "## [X.Y.Z]" prefix followed by end-of-line or a space.
            awk -v ver="$CRATE_VERSION" '
              BEGIN { pfx = "## [" ver "]" }
              !active && substr($0, 1, length(pfx)) == pfx \
                && (length($0) == length(pfx) || substr($0, length(pfx) + 1, 1) == " ") { active=1; next }
              /^## \[/ && active { exit }
              active { print }
            ' ../CHANGELOG.md > "$RUNNER_TEMP/gg-core-notes.txt"
            if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/gg-core-notes.txt"; then
              echo "::error::Release requires actual CHANGELOG notes under a '## [$CRATE_VERSION]' heading"
              exit 1
            fi
          fi

  build:
    name: build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core-runtime
    env:
      RELEASE_VERSION: v${{ needs.verify.outputs.crate_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      # Backend-less ffi-only binaries are not standalone inference releases.
      - name: Require libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (!(Test-Path "$llvm\libclang.dll")) {
            throw "libclang.dll missing; a validated Windows GGUF toolchain is required"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build GGUF-enabled CLI and C FFI on each platform
        run: cargo build --locked --release --features "gguf,ffi"
      - name: Package
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          case "${{ runner.os }}" in
            Linux)   PLATFORM="linux-x86_64";  BIN="gg-core-cli";     LIB="libgg_core.so" ;;
            macOS)   PLATFORM="macos-$(uname -m)"; BIN="gg-core-cli"; LIB="libgg_core.dylib" ;;
            Windows) PLATFORM="windows-x86_64"; BIN="gg-core-cli.exe"; LIB="gg_core.dll" ;;
          esac
          STAGE="gg-core-${VERSION}-${PLATFORM}"
          mkdir -p "dist/${STAGE}"
          cp "target/release/${BIN}" "dist/${STAGE}/"
          cp "target/release/${LIB}" "dist/${STAGE}/"
          cp include/gg_core.h "dist/${STAGE}/"
          cp ../LICENSE ../README.md "dist/${STAGE}/"
          OUTPUT=$("dist/${STAGE}/${BIN}" version)
          if [[ "$OUTPUT" != "GG-CORE ${VERSION#v}" ]]; then
            echo "::error::Packaged CLI reports wrong version: $OUTPUT"
            exit 1
          fi
          "dist/${STAGE}/${BIN}" --help > /dev/null
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          tar -tzf "dist/${STAGE}.tar.gz" | grep -Fx "${STAGE}/${BIN}"
          tar -tzf "dist/${STAGE}.tar.gz" | grep -Fx "${STAGE}/${LIB}"
          tar -tzf "dist/${STAGE}.tar.gz" | grep -Fx "${STAGE}/gg_core.h"
          rm -r "dist/${STAGE:?}"
      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: core-runtime/dist/*.tar.gz
          if-no-files-found: error

  qualify:
    name: qualify (${{ matrix.os }}) — real GGUF inference from the packaged archive
    needs: [verify, build]
    if: github.event_name == 'push' || inputs.qualify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Qwen2.5-0.5B-Instruct Q4_K_M (Apache-2.0), the same fixture the
      # repository tracks under models/ via git-lfs.
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
      MODEL_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.os }}
          path: dist
      - name: Fetch the model fixture (pinned sha256)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -sSL --retry 3 -o models/qwen2.5-0.5b-instruct-q4_k_m.gguf "$MODEL_URL"
          if command -v sha256sum >/dev/null; then ACTUAL=$(sha256sum models/qwen2.5-0.5b-instruct-q4_k_m.gguf | cut -d' ' -f1)
          else ACTUAL=$(shasum -a 256 models/qwen2.5-0.5b-instruct-q4_k_m.gguf | cut -d' ' -f1); fi
          [ "$ACTUAL" = "$MODEL_SHA256" ] || { echo "::error::model fixture sha256 mismatch: $ACTUAL"; exit 1; }
      - name: Install the archive and run the acceptance script
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          [ "${#archives[@]}" -eq 1 ] || { echo "::error::expected one platform archive, got ${#archives[@]}"; exit 1; }
          bash scripts/rc-acceptance.sh "${archives[0]}" "$PWD"

  assemble:
    name: inspect candidate bundle (no publication)
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: v${{ needs.verify.outputs.crate_version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require platform coverage and generate verifiable checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          if [ "${#archives[@]}" -ne 3 ]; then
            echo "::error::Expected 3 platform archives, got ${#archives[@]}"
            exit 1
          fi
          # A mere count of three cannot conceal a missing platform or a
          # duplicate output. Each published archive must have a unique role.
          if [ ! -f "dist/gg-core-$RELEASE_VERSION-linux-x86_64.tar.gz" ] || [ ! -f "dist/gg-core-$RELEASE_VERSION-windows-x86_64.tar.gz" ]; then
            echo "::error::Linux or Windows package missing for $RELEASE_VERSION"
            exit 1
          fi
          mac=(dist/gg-core-"$RELEASE_VERSION"-macos-*.tar.gz)
          if [ "${#mac[@]}" -ne 1 ]; then
            echo "::error::Release bundle missing a distinct Linux, macOS, or Windows archive"
            exit 1
          fi
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Retain exact bundles for manual installation acceptance
        uses: actions/upload-artifact@v4
        with:
          name: gg-core-release-bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish GitHub Release (version tags only)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [assemble, qualify]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: gg-core-release-bundle
          path: dist
      - name: Verify bundled SHA256SUMS
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Same literal-prefix match as the verify job (headings carry a date suffix).
          awk -v ver="$VERSION" '
            BEGIN { pfx = "## [" ver "]" }
            !flag && substr($0, 1, length(pfx)) == pfx \
              && (length($0) == length(pfx) || substr($0, length(pfx) + 1, 1) == " ") { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Missing nonempty CHANGELOG notes for ${VERSION}; publication refused" >&2
            exit 1
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: GG-CORE ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
