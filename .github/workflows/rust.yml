name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Cancel superseded commits for the SAME PR only. Never cancel another PR
# or a protected main push's independent source/security qualification.
# The push fallback uses a unique run ID to preserve every main check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Review C3: machine-enforced supply-chain gate. Advisories (RUSTSEC), the
  # C.O.R.E. forbidden-dependency bans, license allowlist, and registry pinning
  # all live in core-runtime/deny.toml.
  supply-chain:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo deny can resolve a new graph if Cargo.toml and Cargo.lock drift.
      # Refuse lockfile drift before evaluating dependency policy.
      - name: Locked dependency graph gate
        working-directory: core-runtime
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core-runtime/Cargo.toml

  msrv:
    name: declared Rust 1.97 MSRV (locked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
      - name: Verify declared Rust minimum and committed dependency graph
        run: cargo check --locked --all-targets

  native-gpu-feature-graph:
    name: native GPU Cargo feature graph (metadata only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve locked native llama.cpp CUDA and Metal feature graph
        run: cargo metadata --locked --format-version 1 --features gguf-cuda,gguf-metal > /dev/null
      # Metadata is not a native build, installed CUDA/Metal proof, or GPU qualification.

  lint:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Formatting gate
        run: cargo fmt --check
      - name: Lint gate (issue #54 surface on unix runners)
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Test suite (default features)
        run: cargo test --locked --workspace
      - name: Set up Python for cross-platform conformance tests (#114)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Public conformance receipt fail-closed inventory (#114)
        working-directory: .
        run: python -I -m unittest discover -s scripts/qualification -p test_conformance_receipts.py -v
      - name: Windows group shutdown probe negative controls (#219)
        working-directory: .
        run: python -I -m unittest discover -s scripts/qualification -p test_native_shutdown_console.py -v
      - name: Exact-binary identity preflight negative controls (#114)
        run: python -m unittest discover -s scripts -p test_binary_identity.py -v
      - name: Public CLI behavioral contract negative controls (#114)
        run: python -m unittest discover -s scripts -p test_cli_contract.py -v
      - name: Config CLI fail-closed conformance negative controls (#114)
        run: python -m unittest discover -s scripts -p test_config_contract.py -v
      - name: Build default-feature CLI for real identity smoke (#114)
        run: cargo build --locked --bin gg-core-cli
      - name: Execute and verify built CLI provenance (#114)
        run: python scripts/smoke_binary_identity.py
      - name: External exact-Git-revision Cargo consumer (#113)
        working-directory: core-runtime
        run: python scripts/git_consumer_contract.py
      # Cargo does not run #[cfg(test)] in build.rs through cargo test.
      # Compile its pure provenance and Git ref-watch tests explicitly.
      - name: Build-provenance identity and ref-watch tests (#114)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustc --edition=2021 --test build.rs -o target/build-provenance-tests
          ./target/build-provenance-tests --test-threads=1
      - name: Offline ONNX probe pure unit tests (#171)
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: python3 -m unittest discover -s scripts/qualification -p 'test_typed_onnx_packaged_acceptance.py' -v
      - name: Offline Windows qualification runner negative controls (#213)
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: python3 -m unittest discover -s scripts/qualification -p 'test_native_windows_audit_gate.py' -v

  features:
    name: features / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        feature: [gguf, onnx, ffi, python, advanced]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Set up Python (python bindings link libpython)
        if: matrix.feature == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install protoc (candle-onnx builds protobuf via prost-build)
        if: matrix.feature == 'onnx'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Clippy gate (${{ matrix.feature }})
        run: cargo clippy --locked --features ${{ matrix.feature }} --all-targets -- -D warnings
      - name: Test suite (${{ matrix.feature }})
        run: cargo test --locked --features ${{ matrix.feature }}

  # B-34: perf baseline + bench smoke gate. Runs the CI-safe (model-free, GPU-free,
  # default-feature) benches so they cannot silently rot; fails on compile error or
  # bench panic. The criterion output is uploaded as the run's baseline record. The
  # timing-regression threshold (run-over-run cache + critcmp) is B-34b.
  bench:
    name: bench (default-feature, CI-safe set)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      # B-34b: on PRs, restore the most recent main baseline (same runner class) so the
      # gate below can compare. Cache paths are repo-root-relative (not working-directory).
      - name: Restore perf baseline (PR)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: core-runtime/perf-baseline
          key: criterion-baseline-${{ runner.os }}-criterion-0.8.2-${{ github.sha }}
          restore-keys: |
            criterion-baseline-${{ runner.os }}-criterion-0.8.2-
      # rust-cache may restore 0.5.x Criterion analysis files into target/criterion;
      # 0.8.x expects a different base/sample.json layout. Remove scratch analysis
      # before measuring so comparison artifacts cannot masquerade as fresh data.
      # The separate perf-baseline directory is preserved for the run-over-run gate.
      - name: Discard stale Criterion scratch results
        run: rm -rf target/criterion
      - name: Perf gate negative controls (model-free)
        run: python3 -m unittest discover -s scripts -p test_perf_gate.py -v
      - name: Perf benches (default-feature, CI-safe set)
        run: |
          cargo bench --locked \
            --bench ipc_throughput --bench scheduler_throughput --bench concurrent_load \
            --bench memory_overhead --bench kv_cache_throughput \
            --bench generation_throughput --bench inference_latency \
            --bench security_overhead --bench scheduler_queue_overhead \
            --bench prompt_cache_overhead \
            -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      # B-34b: fail the PR if any bench's median regressed > 2.0x vs the main baseline.
      # Generous by design (trimmed criterion is noisy); a cache miss skips-and-passes.
      - name: Perf regression gate (PR)
        if: github.event_name == 'pull_request'
        run: python3 scripts/perf_gate.py perf-baseline target/criterion 2.0
      # B-34b: refresh the cached baseline for future PRs on every push to main.
      - name: Save perf baseline (main)
        if: github.event_name == 'push'
        run: cp -r target/criterion perf-baseline
      - name: Cache perf baseline (main)
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: core-runtime/perf-baseline
          key: criterion-baseline-${{ runner.os }}-criterion-0.8.2-${{ github.sha }}
      - name: Upload criterion baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-baseline
          path: core-runtime/target/criterion
          if-no-files-found: warn
