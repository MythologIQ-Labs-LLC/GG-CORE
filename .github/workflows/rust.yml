name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Formatting gate
        run: cargo fmt --check
      - name: Lint gate (issue #54 surface on unix runners)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Test suite (default features)
        run: cargo test --workspace

  features:
    name: features / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [gguf, onnx, ffi, python]
    defaults:
      run:
        working-directory: core-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-runtime
      - name: Set up Python (python bindings link libpython)
        if: matrix.feature == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clippy gate (${{ matrix.feature }})
        run: cargo clippy --features ${{ matrix.feature }} --all-targets -- -D warnings
      - name: Test suite (${{ matrix.feature }})
        run: cargo test --features ${{ matrix.feature }}
